name: Deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RUSTUP_TOOLCHAIN: 1.92.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake ninja-build libtinfo6 libstdc++6 libgcc-s1
          rustup toolchain install 1.92.0 --profile minimal --target wasm32-unknown-unknown
      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile
      - name: Prepare pinned tools
        shell: python
        run: |
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          cache = str(Path(os.environ["RUNNER_TEMP"]) / "lvw-tools")
          result = subprocess.run([sys.executable, "-B", "toolchains/lvw.py", "prepare", "--cache", cache, "--json"], stdout=subprocess.PIPE, text=True)
          print(result.stdout)
          result.check_returncode()
          tools = json.loads(result.stdout)["tools"]
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"WASI_SDK_PATH={tools['wasi-sdk']['path']}\n")
              output.write(f"LVW_ZIG={tools['zig']['executable']}\n") if "zig" in tools else None
          with open(os.environ["GITHUB_PATH"], "a") as output:
              output.write(str(Path(tools["wasm-tools"]["executable"]).parent) + "\n")
      - name: Build browser artifacts
        run: ./scripts/build.sh
      - name: Assemble Pages site
        run: |
          mkdir -p _site/tests
          cp -R site/. _site/
          cp -R studio _site/studio
          cp -R target _site/target
          cp -R examples _site/examples
          cp -R toolchains _site/toolchains
          cp -R tests/fixtures _site/tests/fixtures
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
