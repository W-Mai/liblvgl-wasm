name: Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: 1.92.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake ninja-build libtinfo6 libstdc++6 libgcc-s1
          rustup toolchain install 1.92.0 --profile minimal \
            --target wasm32-unknown-unknown
      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile
      - name: Prepare pinned tools
        shell: python
        run: |
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          cache = str(Path(os.environ["RUNNER_TEMP"]) / "lvw-tools")
          result = subprocess.run([sys.executable, "-B", "toolchains/lvw.py", "prepare",
                                   "--cache", cache, "--json"], stdout=subprocess.PIPE, text=True)
          print(result.stdout)
          result.check_returncode()
          tools = json.loads(result.stdout)["tools"]
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"WASI_SDK_PATH={tools['wasi-sdk']['path']}\n")
          with open(os.environ["GITHUB_PATH"], "a") as output:
              output.write(str(Path(tools["wasm-tools"]["executable"]).parent) + "\n")
      - name: Export complete package
        run: python3 -B toolchains/lvw.py export-package --cache "$RUNNER_TEMP/lvw-tools" --output target/package --json
      - name: Verify package manifest
        run: python3 -B toolchains/lvw.py verify-package --package target/package --json
      - name: Archive package
        run: |
          archive="liblvgl-wasm-${GITHUB_REF_NAME}.tar.gz"
          tar -C target -czf "$archive" package
          sha256sum "$archive" > "$archive.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: liblvgl-wasm-package-${{ github.ref_name }}
          path: |
            liblvgl-wasm-*.tar.gz
            liblvgl-wasm-*.tar.gz.sha256
