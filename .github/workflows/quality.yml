name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.92.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake ninja-build libtinfo6 libstdc++6 libgcc-s1
          rustup toolchain install 1.92.0 --profile minimal \
            --component rustfmt --component clippy --target wasm32-unknown-unknown
      - name: Install wasi-sdk and wasm-tools
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --retry 3 --output wasi-sdk.tar.gz \
            https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz
          curl --fail --location --retry 3 --output wasm-tools.tar.gz \
            https://github.com/bytecodealliance/wasm-tools/releases/download/v1.246.2/wasm-tools-1.246.2-x86_64-linux.tar.gz
          printf '%s\n' \
            'b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4  wasi-sdk.tar.gz' \
            'f0df9428792225322e9b4344ca581f03b1740d509d6bdad33d14a810009be9ec  wasm-tools.tar.gz' \
            | sha256sum --check
          mkdir wasi-sdk wasm-tools
          tar -xzf wasi-sdk.tar.gz --strip-components=1 -C wasi-sdk
          tar -xzf wasm-tools.tar.gz --strip-components=1 -C wasm-tools
          test -x wasi-sdk/bin/clang
          test -x wasm-tools/wasm-tools
          printf 'WASI_SDK_PATH=%s/wasi-sdk\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf '%s/wasm-tools\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Check
        run: bun run quality
