name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.92.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake ninja-build libtinfo6 libstdc++6 libgcc-s1
          rustup toolchain install 1.92.0 --profile minimal \
            --component rustfmt --component clippy --target wasm32-unknown-unknown
      - name: Install wasi-sdk, wasm-tools, and Zig
        shell: python
        run: |
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          cache = str(Path(os.environ["RUNNER_TEMP"]) / "lvw-tools")
          result = subprocess.run([sys.executable, "-B", "toolchains/lvw.py", "prepare",
                                   "--cache", cache, "--with-zig", "--json"], stdout=subprocess.PIPE, text=True)
          print(result.stdout)
          result.check_returncode()
          tools = json.loads(result.stdout)["tools"]
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"WASI_SDK_PATH={tools['wasi-sdk']['path']}\n")
              output.write(f"LVW_ZIG={tools['zig']['executable']}\n")
          with open(os.environ["GITHUB_PATH"], "a") as output:
              output.write(str(Path(tools["wasm-tools"]["executable"]).parent) + "\n")
          subprocess.run([sys.executable, "-B", "toolchains/lvw.py", "doctor", "--cache", cache,
                          "--with-zig"], check=True)
      - name: Check
        run: bun run quality
      - name: Check LVGL configurations and callbacks
        run: bun run check:compatibility
