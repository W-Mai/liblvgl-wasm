<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#efeeeb">
    <link rel="icon" href="/studio/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/studio/style.css">
    <title>C Demo — LVGL Studio</title>
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem("lvgl-studio-theme") ||
          (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="/studio/" aria-label="LVGL Studio home">
          <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          <span class="brand-name">LVGL<span>Studio</span></span>
        </a>
        <div class="topbar-actions">
          <div class="theme-switch" role="group" aria-label="Color theme">
            <button type="button" data-theme-choice="light" aria-pressed="false">Light</button>
            <button type="button" data-theme-choice="dark" aria-pressed="false">Dark</button>
          </div>
          <a class="topbar-link" href="/studio/">Studio <span aria-hidden="true">↗</span></a>
        </div>
      </header>
      <div class="workspace demo-workspace">
        <aside class="setup-panel demo-info">
          <div class="panel-heading"><h1>C Demo</h1></div>
          <section class="setup-card">
            <div class="card-top"><h2>Source</h2></div>
            <a class="demo-source" href="/examples/c/direct_api.c">direct_api.c <span aria-hidden="true">↗</span></a>
          </section>
          <section class="setup-card">
            <div class="card-top"><h2>Build</h2></div>
            <pre class="command-block"><code>./scripts/build.sh</code></pre>
            <p class="card-note"><code>target/wasm/examples/c/liblvgl-c-demo.wasm</code></p>
          </section>
        </aside>
        <main class="preview-panel">
          <div class="preview-toolbar"><div class="preview-title-row"><h2>Preview</h2><span id="status" class="sr-only" role="status">Loading…</span></div></div>
          <div class="viewport-toolbar">
            <div class="viewport-label"><span class="mini-grid" aria-hidden="true">▦</span> C / LVGL</div>
            <div class="viewport-controls">320 × 240</div>
          </div>
          <div class="stage demo-stage">
            <div class="device-wrap demo-device">
              <div class="device-top"><span class="device-sensor"></span><span class="device-sensor small"></span></div>
              <div class="device-screen"><canvas id="screen" width="320" height="240" aria-label="Interactive LVGL C demo"></canvas></div>
              <div class="device-bottom"><span></span><span></span><span></span><span></span><span></span><span></span></div>
            </div>
          </div>
        </main>
      </div>
    </div>
    <script type="module" src="/examples/c/host.js"></script>
  </body>
</html>
