<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LVGL C API demo</title>
    <style>
      :root { color-scheme: light dark; font: 14px system-ui, sans-serif; background: light-dark(#efeeeb, #20201e); color: light-dark(#262625, #e9e8e5); }
      body { max-width: 760px; margin: 0 auto; padding: 32px 20px; }
      header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid light-dark(#c9c8c4, #4a4a47); padding-bottom: 18px; }
      h1 { font-size: 22px; font-weight: 600; margin: 0; }
      a { color: inherit; text-underline-offset: 3px; }
      p { line-height: 1.5; }
      code { font-family: ui-monospace, monospace; }
      .screen-frame { display: inline-block; max-width: 100%; box-sizing: border-box; padding: 10px; background: light-dark(#d5d4d0, #3b3b39); }
      canvas { display: block; max-width: 100%; height: auto; touch-action: none; background: #fff; }
      #status { color: light-dark(#595955, #b5b4b0); }
    </style>
  </head>
  <body>
    <header><h1>LVGL C API demo</h1><a href="/studio/">Studio</a></header>
    <p>The UI and click handler use LVGL functions in <a href="/examples/c/direct_api.c"><code>direct_api.c</code></a>.</p>
    <div class="screen-frame"><canvas id="screen" width="320" height="240" aria-label="Interactive LVGL C API demo"></canvas></div>
    <p id="status" role="status">Loading LVGL…</p>
    <script type="module" src="/examples/c/host.js"></script>
  </body>
</html>
